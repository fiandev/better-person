<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Personal habit tracker that can help you to be a better person.">
  <meta name="theme-color" content="#ffffff">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Better Person">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <title>Better Person</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: opacity 250ms ease-out;
    }

    #splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash img {
      width: min(40vw, 160px);
      height: auto;
      animation: splash-pulse 1.6s ease-in-out infinite;
    }

    @keyframes splash-pulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.75;
        transform: scale(0.97);
      }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading Better Person">
    <img src="android-chrome-192x192.png" alt="Better Person">
  </div>
  <script>
    (() => {
      if (window.parent === window) return;

      let sent = false;
      let observer;

      const notifyReady = () => {
        if (sent) return;
        sent = true;
        window.parent.postMessage({ type: "flutter-preview-ready" }, "*");
        observer?.disconnect();
      };

      const checkIfRendered = () => {
        const renderedNode = document.querySelector(
          "flt-glass-pane, flutter-view, flt-scene-host, canvas",
        );

        if (!renderedNode) return;

        requestAnimationFrame(() => {
          requestAnimationFrame(notifyReady);
        });
      };

      observer = new MutationObserver(checkIfRendered);
      observer.observe(document.documentElement, {
        childList: true,
        subtree: true,
      });

      window.addEventListener("load", checkIfRendered, { once: true });
      checkIfRendered();
    })();
  </script>
  <script>
    (() => {
      const splash = document.getElementById("splash");
      if (!splash) return;

      const hideSplash = () => {
        if (splash.dataset.hidden === "true") return;
        splash.dataset.hidden = "true";
        splash.classList.add("is-hidden");
        window.setTimeout(() => splash.remove(), 300);
      };

      window.addEventListener("flutter-first-frame", hideSplash, {
        once: true,
      });
      window.setTimeout(hideSplash, 10000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
