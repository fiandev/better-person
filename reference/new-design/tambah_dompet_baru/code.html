<!DOCTYPE html><html lang="id" style=""><head>
<meta charset="utf-8">

                    "on-secondary-fixed": "#002112",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed": "#002114",
                    "surface-container": "#edeeef",
                    "inverse-surface": "#2e3132",
                    "surface-dim": "#d9dadb",
                    "surface-container-highest": "#e1e3e4",
                    "primary": "#0f5238",
                    "tertiary-container": "#3f6754",
                    "error-container": "#ffdad6",
                    "on-primary": "#ffffff",
                    "tertiary-fixed-dim": "#a5d0b9",
                    "on-surface-variant": "#404943",
                    "outline-variant": "#bfc9c1",
                    "on-error-container": "#93000a",
                    "outline": "#707973",
                    "surface-container-high": "#e7e8e9",
                    "background": "#f8f9fa",
                    "on-primary-fixed": "#002114",
                    "on-primary-fixed-variant": "#0e5138",
                    "surface": "#f8f9fa",
                    "on-tertiary-container": "#b8e3cb",
                    "surface-container-lowest": "#ffffff",
                    "surface-variant": "#e1e3e4",
                    "on-secondary": "#ffffff",
                    "surface-container-low": "#f3f4f5",
                    "on-tertiary": "#ffffff",
                    "surface-tint": "#2c694e",
                    "secondary-fixed-dim": "#a4d1b4",
                    "on-primary-container": "#a8e7c5",
                    "on-secondary-container": "#426b54",
                    "primary-fixed": "#b1f0ce",
                    "tertiary": "#274f3d",
                    "on-background": "#191c1d",
                    "inverse-on-surface": "#f0f1f2",
                    "on-error": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "16px",
                    "gutter": "24px",
                    "container-padding-mobile": "16px",
                    "unit": "4px",
                    "container-padding-desktop": "32px",
                    "stack-lg": "32px",
                    "stack-sm": "8px"
            },
            "fontFamily": {
                    "headline-lg-mobile": [
                            "Manrope"
                    ],
                    "body-md": [
                            "Work Sans"
                    ],
                    "label-data": [
                            "JetBrains Mono"
                    ],
                    "headline-lg": [
                            "Manrope"
                    ],

                    ],
                    "display-currency": [

                    ],
                    "body-lg": [

                    ]
            },
            "fontSize": {
                    "headline-lg-mobile": [
                            "28px",
                            {

                                    "fontWeight": "600"

                    ],
                    "body-md": [
                            "16px",

                    "label-data": [
                            "14px",

                    ],
                    "headline-lg": [

                    "headline-md": [

                    ],
                    "display-currency": [

        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-sm">
<div class="flex items-center justify-between px-container-padding-mobile h-16 w-full">
<button class="text-on-surface-variant dark:text-outline hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-inverse-primary tracking-tight">Tambah Dompet</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</div>
</header>
<main class="mt-20 px-container-padding-mobile md:px-container-padding-desktop max-w-3xl mx-auto space-y-stack-lg">
<!-- Interactive Preview Card -->
<section class="bg-gradient-to-br from-primary-container to-tertiary-container rounded-xl p-6 shadow-[0_12px_24px_rgba(27,67,50,0.08)] text-on-primary relative overflow-hidden">
<div class="absolute -top-10 -right-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
<div class="relative z-10 flex flex-col space-y-stack-md">
<div class="flex justify-between items-center">
<div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm" id="preview-icon-container">
<span class="material-symbols-outlined text-on-primary text-2xl" data-icon="account_balance_wallet" id="preview-icon">account_balance_wallet</span>
</div>
<span class="font-label-data text-label-data text-white/80">**** 1234</span>
</div>
<div>
<p class="font-body-md text-body-md text-white/80">Saldo Saat Ini</p>
<h2 class="font-display-currency text-display-currency" id="preview-balance">Rp 0</h2>
</div>
<p class="font-headline-md text-headline-md mt-unit" id="preview-name">Dompet Baru</p>
</div>
</section>
<!-- Form Section -->
<section class="bg-surface-bright rounded-xl shadow-[0_4px_12px_rgba(27,67,50,0.04)] p-6 space-y-stack-md">
<div class="space-y-stack-sm">
<label class="block font-label-data text-label-data text-on-surface-variant" for="wallet-name">Nama Dompet</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="edit">edit</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm" id="wallet-name" oninput="document.getElementById('preview-name').textContent = this.value || 'Dompet Baru'" placeholder="Contoh: Tabungan Liburan" type="text">
</div>
</div>
<div class="space-y-stack-sm pt-stack-sm">
<label class="block font-label-data text-label-data text-on-surface-variant" for="initial-balance">Saldo Awal</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="font-body-md text-body-md text-outline font-semibold">Rp</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm" id="initial-balance" oninput="document.getElementById('preview-balance').textContent = 'Rp ' + (parseInt(this.value) || 0).toLocaleString('id-ID')" placeholder="0" type="number">
</div>
<div class="flex items-start space-x-2 mt-2 bg-error-container/30 p-3 rounded-md border border-error-container">
<span class="material-symbols-outlined text-error text-sm mt-0.5" data-icon="info">info</span>
<p class="font-body-md text-[13px] leading-tight text-on-surface-variant">
                        Saldo awal bersifat permanen dan tidak dapat diubah setelah dompet dibuat. Pastikan jumlahnya benar.
                    </p>
</div>
</div>
<div class="space-y-stack-sm pt-stack-sm">
<label class="block font-label-data text-label-data text-on-surface-variant">Pilih Ikon</label>
<div class="flex flex-col gap-2 max-h-64 overflow-y-auto pr-2">
  <button class="w-full flex items-center gap-3 p-3 rounded-lg bg-secondary-container border-2 border-primary transition-all" onclick="selectIcon(this, 'account_balance_wallet')">
    <span class="material-symbols-outlined text-on-secondary-container" data-icon="account_balance_wallet">account_balance_wallet</span>
    <span class="font-body-md text-on-secondary-container">Dompet Umum</span>
  </button>
  <button class="w-full flex items-center gap-3 p-3 rounded-lg bg-surface-container-high border-2 border-transparent hover:border-primary-fixed-dim transition-all" onclick="selectIcon(this, 'savings')">
    <span class="material-symbols-outlined text-on-surface-variant" data-icon="savings">savings</span>
    <span class="font-body-md text-on-surface-variant">Tabungan</span>
  </button>
  <button class="w-full flex items-center gap-3 p-3 rounded-lg bg-surface-container-high border-2 border-transparent hover:border-primary-fixed-dim transition-all" onclick="selectIcon(this, 'flight_takeoff')">
    <span class="material-symbols-outlined text-on-surface-variant" data-icon="flight_takeoff">flight_takeoff</span>
    <span class="font-body-md text-on-surface-variant">Perjalanan</span>
  </button>
  <button class="w-full flex items-center gap-3 p-3 rounded-lg bg-surface-container-high border-2 border-transparent hover:border-primary-fixed-dim transition-all" onclick="selectIcon(this, 'home_work')">
    <span class="material-symbols-outlined text-on-surface-variant" data-icon="home_work">home_work</span>
    <span class="font-body-md text-on-surface-variant">Rumah</span>
  </button>
  <button class="w-full flex items-center gap-3 p-3 rounded-lg bg-surface-container-high border-2 border-transparent hover:border-primary-fixed-dim transition-all" onclick="selectIcon(this, 'directions_car')">
    <span class="material-symbols-outlined text-on-surface-variant" data-icon="directions_car">directions_car</span>
    <span class="font-body-md text-on-surface-variant">Kendaraan</span>
  </button>
</div>
</div>
<div class="pt-stack-lg">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-xl shadow-[0_4px_12px_rgba(27,67,50,0.15)] hover:bg-primary-container active:scale-95 transition-all duration-200 flex items-center justify-center space-x-2">
<span class="material-symbols-outlined" data-icon="save">save</span>
<span class="">Simpan Dompet</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-20 flex justify-around items-center px-4 pb-safe bg-surface-container-lowest dark:bg-surface-container z-50 rounded-t-xl shadow-[0_-4px_12px_rgba(27,67,50,0.04)] md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-inverse-surface rounded-full transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-data text-label-data mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-inverse-surface rounded-full transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="track_changes">track_changes</span>
<span class="font-label-data text-label-data mt-1">Focus</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-inverse-surface rounded-full transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="favorite">favorite</span>
<span class="font-label-data text-label-data mt-1">Devotion</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-primary-container text-on-secondary-container dark:text-on-primary-container rounded-full px-4 py-1 hover:bg-surface-container-high dark:hover:bg-inverse-surface transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="payments" data-weight="fill">payments</span>
<span class="font-label-data text-label-data mt-1">Finance</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-inverse-surface rounded-full transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-data text-label-data mt-1">Profile</span>
</button>
</nav>
<script>
        function selectIcon(btn, iconName) {
            // Reset all buttons
            const buttons = btn.parentElement.querySelectorAll('button');
            buttons.forEach(b => {
                b.classList.remove('bg-secondary-container', 'border-primary');
                b.classList.add('bg-surface-container-high', 'border-transparent');
                b.querySelector('span').classList.remove('text-on-secondary-container');
                b.querySelector('span').classList.add('text-on-surface-variant');
            });
            
            // Set active button
            btn.classList.remove('bg-surface-container-high', 'border-transparent');
            btn.classList.add('bg-secondary-container', 'border-primary');
            btn.querySelector('span').classList.remove('text-on-surface-variant');
            btn.querySelector('span').classList.add('text-on-secondary-container');

            // Update preview
            document.getElementById('preview-icon').textContent = iconName;
            document.getElementById('preview-icon').setAttribute('data-icon', iconName);
        }
    </script>
</body></html>
