<!-- From Wallet Card -->

<div class="flex justify-between items-start mb-4">
<div>

<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
</div>

</div>
</div>
<!-- Directional Arrow -->

<!-- To Wallet Card -->

<div class="flex justify-between items-start mb-4">
<div>
<p class="text-on-surface-variant font-body-md mb-1">To Account</p>
<h2 class="font-headline-md text-headline-md-mobile md:text-headline-md text-primary">Emergency Fund</h2>
</div>
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container">

</div>

</a>

<script>
        // Simple interaction for the amount input to show a progress bar effect
        const amountInput = document.getElementById('amount');
        const amountBar = document.getElementById('amount-bar');
        
        if(amountInput && amountBar) {
            amountInput.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value) || 0;
                // Max visual width at $5000 for this example
                const max = 5000;
                let percentage = (val / max) * 100;
                if(percentage > 100) percentage = 100;
                amountBar.style.width = `${percentage}%`;
            });
        }
    </script>
